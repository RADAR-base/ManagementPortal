name: Trivy dependency scan

on:
 - pull_request

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Trivy only sees Gradle dependencies through lockfiles. This locks just the shipped classpath.
      - name: Lock the runtime classpath for Trivy
        run: ./gradlew -I .github/trivy-lock.init.gradle trivyLock --write-locks

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      # Every severity, also unfixed, so MEDIUM findings on shipped packages stay visible.
      - name: List all findings
        run: |
          {
            echo '### Trivy: all findings'
            echo '```'
            trivy fs --quiet --scanners vuln --ignorefile .trivyignore.yaml --format table .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on fixable HIGH/CRITICAL findings
        run: >-
          trivy fs
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore.yaml
          --exit-code 1
          .
